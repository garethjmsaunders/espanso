matches:

    # 195 metal CDs

    - trigger: "--195chat"
      replace: "I am a music blogger who reviews rock, metal, and punk albums in Markdown format. I write in a thoughtful, emotionally aware tone, blending technical analysis with personal commentary. I value genre-blending, strong production, and melodic content, and I sometimes refer to my regular readers in a conversational tone.\n\nI will provide:\n\n* A press release (for background and promo copy)\n* A track list with my personal notes about each song\n\n(1) WRITE A REVIEW\n\n* Please generate a first draft of the review using the structure and style below.\n* You can borrow key factual info from the press release, but reword it in my voice.\n* Use my notes to guide your review section, especially highlighting tracks I found notable.\n* IMPORTANT: Format your draft review using Markdown and follow this structure exactly:\n\n## Details\n\n{Include release info such as producer, mixer, release date. Mention similar artists using the format: \"For fans of:\". Include relevant social/media links in this order and separated by the pipe character like this (in Markdown, and removing any links that are not available): ' | ': Bandcamp | Encyclopaedia Metallum | Facebook | Instagram | Soundcloud | Spotify | Tiktok | Twitter | Website | YouTube.}\n\n## Band\n\n* Vocals\n* Guitar\n* Bass\n* Drums\n* Other instruments (if applicable)\n\n## Tracks\n\n1. Track name\n2. Track name\n3. ...\n\n## Review\n\n{Write an insightful, emotionally aware review. Use vivid language and reflect on the listening experience, notable moments, stand-out tracks, production quality, and mood. Mention specific track highlights. It’s okay to critique constructively.}\n\n{After you mention each track in the review, follow it with the track number, for example: \"Exciting song title\" (track 1).}\n\n## Conclusion\n\n{Summarise your verdict on the album. Include personal reflections or comments on how long you’ve been listening. Add the review score as a percentage.}\n\n## Video\n\n[LINK_TO_YOUTUBE]\n\n## Disclosure\n\n{PROMOTER_NAME} contacted me inviting me to preview {BAND_NAME}’s forthcoming album, thank you. I have no connections to either {PROMOTER_NAME} or {BAND_NAME}. I’m not being paid to review this, but I did get a free {digital} copy of the album to review which is pretty cool. Many thanks to {CONTACT_NAME} from {PROMOTER_NAME}, and to {BAND_NAME} for continuing to create fresh, exciting {GENRE}.}\n\n(2) WRITE AN EXCERPT\n\nWrite a conversational, reflective excerpt (maximum of 50 words) in first person for WordPress. It should read like the emotional takeaway or a lingering thought, as if lifted from the review. Keep it informal and authentic. Avoid listing facts. Length must be under 50 words.\n\nExample: There’s a moment on track three that just floored me. I’ve had this album on loop all week—it’s that good.\n\n(3) PRESS RELEASE\n\nPROMOTER_NAME\n\nPRESS_RELEASE_HERE\n\n(4) TRACK LIST AND GARETH'S NOTES\n\nGARETH_NOTES"

    - trigger: "--195template"
      replace: "## Details\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit.\n\nBandcamp | Encyclopaedia Metallum | Facebook | Instagram | Soundcloud | Tiktok | Twitter | Website | YouTube\n\n## Band\n\n* Vocals, Guitar, Bass, Keyboard, Other, Drums\n\n## Tracks\n\n1. Track 1\\n2. Track 2\n\n## Review\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit.\n\n## Conclusion\n\nReview score: %\n\n## Video\n\nLINK_TO_YOUTUBE\n\n## Disclosure\n\nPROMOTER contacted me inviting me to preview BAND_NAME 's forthcoming album, thank you. I have no connections to either PROMOTER or BAND. I’m not being paid to review this, but I did get a free digital copy of the album to review which is pretty cool. Many thanks to NAME from PROMOTER, and to BAND for continuing to create fresh, exciting GENRE.\n\n## Notes"

    - trigger: "--195sig"
      replace: "--\n\nGareth J M Saunders\n195 metal CDs | Independent metal, hardcore, punk and rock reviews from Scotland\n\n195metalcds@gmail.com\nwww.195metalcds.com"

    # Agile

    - trigger: "--5thieves"
      replace: "Five thieves of time\n\n1. Too much work-in-progress (WIP)\n2. Unknown dependencies\n3. Unplanned work\n4. Conflicting priorities\n5. Neglected work\n\nDominica DeGrandis, Making Work Visible: Exposing Time Theft to Optimize Workflow (2017)"

    - trigger: "--agilemanifesto"
      replace: "We are uncovering better ways of developing software by doing it and helping others do it. Through this work we have come to value:\n\nIndividuals and interactions over processes and tools\nWorking software over comprehensive documentation\nCustomer collaboration over contract negotiation\nResponding to change over following a plan\n\nThat is, while there is value in the items on the right, we value the items on the left more."

    - trigger: "--boscard"
      replace: "background, objectives, scope, constraints, assumptions, risks and deliverables"

    - trigger: "--pestle"
      replace: "political, economic, socio-cultural, technological, legal, and environmental"

    - trigger: "--scrumvalues"
      replace: "commitment, courage, focus, openness, respect"

    - trigger: "--smast"
      replace: "scrum master"

    - trigger: "--smart"
      replace: "specific, measurable, achievable, relevant and time-bound"


    # Corrections

    - trigger: "creme fraiche"
