    - trigger: "crepe"
      replace: "crêpe"

    - trigger: "THanks"
      replace: "Thanks"

    - trigger: "THe"
      replace: "The"      


    # Dates
    # See https://docs.rs/chrono/latest/chrono/format/strftime/index.html for style codes

    # Now : Wednesday 24 December 2025, 21:15
    - trigger: "--now"
      replace: "{{now}}"
      vars:
        - name: now
          type: date
          params:
            format: "%A %d %B %Y, %H:%M"


    # Yesterday : Tuesday 23 December 2025
    - trigger: "--yest"
      replace: "{{yesterday}}"
      vars:
        - name: yesterday
          type: date
          params:
            format: "%A %-d %B %Y"
            offset: -86400

    # Today : Wednesday 24 December 2025
    - trigger: "--today"
      replace: "{{today}}"
      vars:
        - name: today
          type: date
          params:
            format: "%A %-d %B %Y"

    # Tomorrow : Thursday 25 December 2025
    - trigger: "--tom"
      replace: "{{tomorrow}}"
      vars:
        - name: tomorrow
          type: date
          params:
            format: "%A %-d %B %Y"
            offset: 86400


    # Yesterday (ISO) 2025-12-23
    - trigger: "--dddc"
      replace: "{{isodate}}"
      vars:
        - name: isodate
          type: date
          params:
            format: "%Y-%m-%d"
            offset: -86400

    # Today (ISO) 2025-12-24
    - trigger: "--dddd"
      replace: "{{isodate}}"
      vars:
        - name: isodate
          type: date
          params:
            format: "%Y-%m-%d"

    # Tomorrow (ISO) 2025-12-25
    - trigger: "--ddde"
      replace: "{{isodate}}"
      vars:
        - name: isodate
          type: date
          params:
            format: "%Y-%m-%d"
            offset: 86400


